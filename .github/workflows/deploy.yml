name: CI i deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages nie znosi anulowania wdrozenia w trakcie — przerwane wdrozenie zawisa
# po stronie GitHuba i blokuje kolejne. Kolejkujemy zamiast anulowac.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Kolejnosc z briefu: lint > build > deploy (z dolozonym typecheck i testami).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testy jednostkowe
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Domyslne 10 minut bywa za malo, gdy publikacja po stronie GitHub Pages
          # zwalnia — przekroczenie limitu zostawia wdrozenie zawieszone i blokuje
          # kolejne. 20 minut daje zapas bez wplywu na normalny przebieg.
          timeout: 1200000
