name = "pdf-insight-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[vars]
# Lista dozwolonych origin, rozdzielona przecinkami. Pierwszy to produkcja,
# drugi pozwala pracowac lokalnie (npm run dev) bez zmiany konfiguracji.
ALLOWED_ORIGINS = "https://kacperkurowski02.github.io,http://localhost:5173"
MODEL = "gemini-2.5-flash"

# Klucz API NIE trafia tutaj. Ustaw go poleceniem:
#   npx wrangler secret put GEMINI_API_KEY

# Magazyn KV dla limitu zadan. Bez niego licznik zyje w pamieci pojedynczego
# izolatu Workera, wiec przy ruchu z wielu lokalizacji limit jest w praktyce
# luzniejszy, niz wynika z konfiguracji. KV daje licznik wspolny dla calej krawedzi.
# Utworzony poleceniem: npx wrangler kv namespace create RATE_LIMIT
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "35a9193e49254e19bc7e800470d32e46"
